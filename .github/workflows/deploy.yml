name: ShopAPI CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar SSH (MANUAL - EVITA EL ERROR DE LIBCRYPTO)
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          # Escribe la clave directamente en un archivo protegido
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Inicia el agente de SSH y añade la clave apuntando al archivo
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa
          
          # Guardamos las variables del agente para los siguientes pasos
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      # 3. Agregar VPS a known hosts
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 4. Probar conexión SSH
      - name: Test SSH
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "echo SSH OK"

      # 5. Deploy en VPS
      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}

            git pull origin main

            uv sync

            uv run python manage.py migrate

            uv run python manage.py collectstatic --noinput

            sudo systemctl restart gunicorn-shopapi
            sudo systemctl restart nginx
          EOF