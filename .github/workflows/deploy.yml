name: ShopAPI CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar la clave SSH de forma manual (Esto evita el error de libcrypto por completo)
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          # Guardamos tu clave directamente en un archivo físico protegido
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Encendemos el agente de SSH nativo de Linux y registramos el archivo
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa
          
          # Guardamos la sesión del agente para que los siguientes pasos la recuerden
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      # 3. Agregar la IP de tu servidor a los hosts conocidos
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 4. Probar que la conexión funcione
      - name: Test SSH
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "echo SSH OK"

      # 5. Ejecutar los comandos de despliegue en tu servidor
      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}

            git pull origin main

            uv sync

            uv run python manage.py migrate

            uv run python manage.py collectstatic --noinput

            sudo systemctl restart gunicorn-shopapi
            sudo systemctl restart nginx
          EOF